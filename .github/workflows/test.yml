name: test

on:
  push:
  pull_request:
  # workflow_dispatch:
  # schedule:
  #   - cron: "51 3 * * 6" # Runs at 03:51, only on Saturday
jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}-latest
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu", "macos"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: latest
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - run: |
          pip3 install matplotlib seaborn
      - name: Install dependencies
        run: shards install --without-development --release
      - name: Build
        run: make
      - name: Run tests
        run: make test
      - name: Build executables
        run: |
          make examples
      - name: Run excutables
        run: |
          find ./bin -type f ! -name "*.dwarf" | xargs chmod +x
          find ./bin -type f ! -name "*.dwarf" | xargs -L1

