name: test

on:
  push:
  pull_request:
  # workflow_dispatch:
  # schedule:
  #   - cron: "51 3 * * 6" # Runs at 03:51, only on Saturday
jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}-latest
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu", "macos"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: latest
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - run: |
          pip3 install matplotlib seaborn
      - name: Install dependencies
        run: shards install --without-development --release
      - name: Build
        run: make
      - name: Run tests
        run: make test
      - name: Build executables
        run: |
          make examples
      - name: Run excutables
        run: |
          find ./bin -type f ! -name "*.dwarf" | xargs chmod +x
          find ./bin -type f ! -name "*.dwarf" | xargs -L1

  stability:
    name: stability (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: latest
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - run: |
          pip3 install matplotlib seaborn
      - name: Install debug tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gdb
      - name: Collect diagnostic baseline
        run: |
          set -euo pipefail
          mkdir -p .ci-logs
          {
            echo "== uname =="
            uname -a
            echo
            echo "== python =="
            python3 --version
            python3 -c "import sys, sysconfig; print(sys.version); print('LIBDIR=', sysconfig.get_config_var('LIBDIR'))"
            echo
            echo "== crystal =="
            crystal --version
            echo
            echo "== python3-config --ldflags =="
            python3-config --ldflags
            echo
            echo "== env =="
            env | sort
          } > .ci-logs/baseline.log
      - name: Install dependencies
        run: shards install --without-development --release
      - name: Run tests repeatedly (diagnostic mode)
        run: |
          set -euo pipefail
          mkdir -p .ci-logs
          touch .ci-logs/started.log

          ITERATIONS=20

          CMD="$(make -n test CRYTHON_DEBUG=1 verbose=1 | tail -n1)"
          CMD="$CMD --error-trace"
          echo "Resolved test command: $CMD" | tee .ci-logs/resolved-command.log
          echo "Iterations: ${ITERATIONS}" | tee -a .ci-logs/resolved-command.log

          ulimit -c unlimited || true

          for i in $(seq 1 ${ITERATIONS}); do
            echo "Iteration $i"
            LOG_FILE=".ci-logs/stability-${i}.log"

            if ! PYTHONMALLOC=debug PYTHONFAULTHANDLER=1 PYTHONDEVMODE=1 PYTHONTRACEMALLOC=25 bash -lc "$CMD" 2>&1 | tee "$LOG_FILE"; then
              echo "Iteration $i failed. Capturing gdb backtrace..." | tee -a "$LOG_FILE"

              SPEC_BIN="$(find /home/runner/.cache/crystal -maxdepth 1 -name 'crystal-run-spec.tmp' | head -n1 || true)"
              echo "SPEC_BIN=${SPEC_BIN}" | tee -a "$LOG_FILE"

              gdb -q -batch \
                -ex "set pagination off" \
                -ex "set confirm off" \
                -ex "run" \
                -ex "info threads" \
                -ex "thread apply all bt full" \
                -ex "info registers" \
                -ex 'x/16i $pc' \
                --args bash -lc "PYTHONMALLOC=debug PYTHONFAULTHANDLER=1 PYTHONDEVMODE=1 PYTHONTRACEMALLOC=25 $CMD" \
                > ".ci-logs/gdb-${i}.log" 2>&1 || true

              CORE_FILE="$(find . /tmp /home/runner/work -maxdepth 4 -type f \( -name 'core' -o -name 'core.*' \) 2>/dev/null | head -n1 || true)"
              if [ -n "${CORE_FILE}" ] && [ -n "${SPEC_BIN}" ]; then
                gdb -q -batch \
                  -ex "set pagination off" \
                  -ex "info threads" \
                  -ex "thread apply all bt full" \
                  -ex "info registers" \
                  -ex 'x/16i $pc' \
                  "${SPEC_BIN}" "${CORE_FILE}" \
                  > ".ci-logs/gdb-core-${i}.log" 2>&1 || true
              fi

              exit 1
            fi
          done

      - name: Collect crash artifacts into .ci-logs
        if: always()
        run: |
          set -euo pipefail
          mkdir -p .ci-logs
          cp -f /home/runner/.cache/crystal/crystal-run-spec.tmp .ci-logs/ 2>/dev/null || true
          cp -f /home/runner/.cache/crystal/crystal-run-spec.tmp.dwarf .ci-logs/ 2>/dev/null || true
          find . /tmp /home/runner/work -maxdepth 4 -type f \( -name 'core' -o -name 'core.*' \) 2>/dev/null -exec cp -f {} .ci-logs/ \; || true
          find .ci-logs -maxdepth 2 -type f -print | sort > .ci-logs/files.txt || true

      - name: Upload stability diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stability-diagnostics
          if-no-files-found: warn
          path: .ci-logs

