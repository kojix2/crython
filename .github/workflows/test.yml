name: test

on:
  push:
  pull_request:
  # workflow_dispatch:
  # schedule:
  #   - cron: "51 3 * * 6" # Runs at 03:51, only on Saturday
jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}-latest
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu", "macos"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: latest
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - run: |
          pip3 install matplotlib seaborn
      - name: Install dependencies
        run: shards install --without-development --release
      - name: Build
        run: make
      - name: Run tests
        run: make test
      - name: Build executables
        run: |
          make examples
      - name: Run excutables
        run: |
          find ./bin -type f ! -name "*.dwarf" | xargs chmod +x
          find ./bin -type f ! -name "*.dwarf" | xargs -L1

  stability:
    name: stability (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: latest
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - run: |
          pip3 install matplotlib seaborn
      - name: Install debug tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gdb
      - name: Install dependencies
        run: shards install --without-development --release
      - name: Run tests repeatedly (diagnostic mode)
        run: |
          set -euo pipefail
          mkdir -p .ci-logs

          CMD="$(make -n test CRYTHON_DEBUG=1 verbose=1 | tail -n1)"
          echo "Resolved test command: $CMD" | tee .ci-logs/resolved-command.log

          for i in 1 2 3 4 5; do
            echo "Iteration $i"
            LOG_FILE=".ci-logs/stability-${i}.log"

            if ! PYTHONMALLOC=debug PYTHONFAULTHANDLER=1 bash -lc "$CMD" 2>&1 | tee "$LOG_FILE"; then
              echo "Iteration $i failed. Capturing gdb backtrace..." | tee -a "$LOG_FILE"

              gdb -q -batch \
                -ex "set pagination off" \
                -ex "set confirm off" \
                -ex "run" \
                -ex "thread apply all bt full" \
                --args bash -lc "PYTHONMALLOC=debug PYTHONFAULTHANDLER=1 $CMD" \
                > ".ci-logs/gdb-${i}.log" 2>&1 || true

              exit 1
            fi
          done

      - name: Upload stability diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stability-diagnostics
          path: .ci-logs

