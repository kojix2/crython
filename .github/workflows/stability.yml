name: stability

on:
  push:
  pull_request:

jobs:
  stability:
    name: stability (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: latest
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - run: |
          pip3 install matplotlib seaborn
      - name: Install gdb
        run: |
          sudo apt-get update
          sudo apt-get install -y gdb
      - name: Configure core dump output
        run: |
          set -euo pipefail
          mkdir -p ci-logs /tmp/crython-core
          sudo sysctl -w kernel.core_pattern=/tmp/crython-core/core.%e.%p.%t || true
          sudo sysctl -w kernel.core_uses_pid=1 || true
          {
            echo "core_pattern=$(cat /proc/sys/kernel/core_pattern || true)"
            echo "core_uses_pid=$(cat /proc/sys/kernel/core_uses_pid || true)"
          } > ci-logs/core-config.log
      - name: Install dependencies
        run: shards install --without-development --release
      - name: Build spec binary for postmortem
        run: |
          set -euo pipefail
          mkdir -p ci-logs
          PYTHON_VERSION="$(python3 -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')"
          LINK_FLAGS="$(python3-config --ldflags) -lpython${PYTHON_VERSION} -lm"
          crystal spec -v --error-trace --link-flags "${LINK_FLAGS}" -o ci-logs/spec-bin
      - name: Run tests repeatedly
        run: |
          set -euo pipefail
          mkdir -p ci-logs
          : > ci-logs/started.log

          ITERATIONS=100
          echo "Command: PYTHONFAULTHANDLER=1 PYTHONMALLOC=debug make test CRYTHON_DEBUG=1 verbose=1" > ci-logs/config.log
          echo "Iterations: ${ITERATIONS}" >> ci-logs/config.log
          ulimit -c unlimited || true

          for i in $(seq 1 ${ITERATIONS}); do
            echo "Iteration $i"
            LOG_FILE="ci-logs/stability-${i}.log"
            if ! PYTHONFAULTHANDLER=1 PYTHONMALLOC=debug make test CRYTHON_DEBUG=1 verbose=1 2>&1 | tee "$LOG_FILE"; then
              echo "Iteration $i failed" | tee -a "$LOG_FILE"

              SPEC_BIN="ci-logs/spec-bin"
              if [ ! -f "${SPEC_BIN}" ]; then
                SPEC_BIN="$(find /home/runner/.cache/crystal -maxdepth 1 -type f -name 'crystal-run-spec.tmp' | head -n1 || true)"
              fi
              if [ -z "${SPEC_BIN}" ]; then
                SPEC_BIN="$(find /home/runner/.cache/crystal -maxdepth 1 -type f -name 'crystal-run-spec.tmp*' ! -name '*.dwarf' | head -n1 || true)"
              fi
              CORE_FILE="$(find /tmp/crython-core /tmp /home/runner/work . -maxdepth 5 -type f \( -name 'core' -o -name 'core.*' \) 2>/dev/null | head -n1 || true)"

              echo "SPEC_BIN=${SPEC_BIN}" | tee -a "$LOG_FILE"
              echo "CORE_FILE=${CORE_FILE}" | tee -a "$LOG_FILE"

              if [ -n "${CORE_FILE}" ] && [ -n "${SPEC_BIN}" ]; then
                gdb -q -batch \
                  -ex "set pagination off" \
                  -ex "info threads" \
                  -ex "thread apply all bt full" \
                  -ex "info registers" \
                  -ex 'x/16i $pc' \
                  "${SPEC_BIN}" "${CORE_FILE}" \
                  > "ci-logs/gdb-core-${i}.log" 2>&1 || true
              fi

              cp -f /home/runner/.cache/crystal/crystal-run-spec.tmp ci-logs/ 2>/dev/null || true
              cp -f /home/runner/.cache/crystal/crystal-run-spec.tmp.dwarf ci-logs/ 2>/dev/null || true
              find /tmp/crython-core /tmp /home/runner/work . -maxdepth 5 -type f \( -name 'core' -o -name 'core.*' \) 2>/dev/null -exec cp -f {} ci-logs/ \; || true
              exit 1
            fi
          done

      - name: Index diagnostics files
        if: always()
        run: |
          set -euo pipefail
          mkdir -p ci-logs
          find ci-logs -maxdepth 2 -type f -print | sort > ci-logs/files.txt || true

      - name: Upload stability diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stability-diagnostics
          if-no-files-found: warn
          path: ci-logs
